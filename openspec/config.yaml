schema: spec-driven

context: |
  # Habit Coach AI — Plataforma de Coaching de Hábitos com IA

  ## Domain
  Plataforma SaaS de coaching personalizado para construção de hábitos e alcance de metas,
  diferenciada pela integração de IA com personalidades de personagens famosos icônicos
  (Mestre Yoda, General Motivador, etc.).
  Cada usuário visualiza apenas seus próprios dados (user_id scoping em todas as queries).
  Modelo de negócio freemium com plano Pro (R$ 29,90/mês).

  ### Core Features (MVP):
  - Sistema de hábitos (rastreamento, streaks, checklist diária)
  - Sistema de metas (com decomposição automática de subtarefas via MCP/IA)
  - IA conversacional com personalidades famosas
  - Dashboards de visualização de progresso
  - Notificações no app

  ## Reference
  **Tech Stack, Project Structure, Patterns, and Conventions are documented in `docs/PATTERNS.md`.**
  Always consult this file for:
  - Route groups and feature module structure
  - Page, Server Actions, and Form patterns
  - Database (Drizzle ORM) conventions
  - Auth utilities and flows
  - UI/Component best practices

rules:
  proposal:
    - Sempre considerar o feature module pattern existente (pages → actions → components → schemas → types)
    - Propostas devem especificar a qual route group a feature pertence — (private), (public) ou compartilhado
    - Incluir mudanças de schema do banco quando a feature requer novas tabelas ou colunas
    - Considerar isolamento de dados por usuário (userId filtering) para todas as operações
    - Todos os textos voltados ao usuário devem seguir as diretrizes de i18n com foco em pt-BR
    - Considerar os limites do plano Free vs Pro (ex: 3 hábitos, 1 meta, 1 personalidade de IA)
    - Mencionar se a feature envolve integração com IA (OpenAI/MCP)
    - "Sempre incluir uma seção de 'Testing Strategy' descrevendo quais testes serão escritos para validar a feature"
    - "Definir Critérios de Aceite claros que possam ser verificados através de testes"

  design:
    - "Incluir uma seção de 'Test Plan' com casos de teste detalhados"
    - "Especificar os tipos de teste necessários (unitário, integração, e2e)"
    - "Definir estratégias de mock para dependências externas, banco de dados e APIs (ex: OpenAI/MCP)"
    - "Garantir que as escolhas de infraestrutura e arquitetura permitam e facilitem a testabilidade"

  tasks:
    - "Quebrar tarefas em chunks de no máximo 2 horas"
    - "Sempre seguir o fluxo de TDD nesta exata ordem para cada funcionalidade:"
    - "1) [TDD-TEST] Escrever testes falhando primeiro"
    - "2) [TDD-IMPL] Implementar o código mínimo para passar nos testes"
    - "3) [TDD-IMPL] Refatorar com segurança"
    - "4) [QUALITY] Rodar lint e typecheck"
    - "Tarefas de Teste DEVEM ser listadas ANTES das tarefas de Implementação"
    - "Zero falsos positivos: Testes devem possuir isolamento, não ter interdependências, mockar dependências externas apropriadamente e não depender de timing/race conditions"
    - "Cada tarefa de teste deve especificar os paths dos arquivos de teste e as descrições dos casos"
    - Cada tarefa de implementação deve especificar arquivos afetados e o pattern que seguem
    - Server actions devem usar next-safe-action com validação Zod
    - Incluir criação de Zod schema como tarefa separada quando novos formulários estão envolvidos
    - Tarefas de migração de banco de dados devem ser separadas das tarefas de código da aplicação
    - Sempre incluir chamadas de revalidatePath após actions de mutação
    - Incluir tipagem TypeScript (types/) quando novos tipos são necessários
    # --- Code Quality & Verification ---
    - "Filosofia de Qualidade de Código: Type safety é mandatória, prefira tipagem explícita sobre inferência nas fronteiras"
    - "Sem 'any' implícito, DTOs devem ser totalmente tipados, valores desconhecidos devem usar type guards/Zod"
    - "ESLint (MANDATÓRIO): Nunca usar eslint-disable, ts-ignore ou 'as any'"
    - "Deve seguir SEMPRE o eslint e verificar se não existe erro de eslint. Caso exista, DEVE corrigir imediatamente"
    - "Sempre criar uma tarefa de validação/lint rodando: pnpm eslint ."
    - "Sempre criar uma tarefa de typecheck rodando: tsc --noEmit"
    - "O código só é válido se lint e typecheck passarem; caso contrário, crie tarefas adicionais de correção"
